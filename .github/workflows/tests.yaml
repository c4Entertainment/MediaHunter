name: 'tests'

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # No API keys needed: the unit tests make no network calls.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Lint is left out for now: lintDebug crashes inside AGP's lint report task
      # (StringIndexOutOfBoundsException), not on findings in this code.
